<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aishwarya ❤️ Atul</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{margin:0;overflow:hidden;background:black;font-family:'Poppins',sans-serif;color:white;text-align:center;}
#intro{position:fixed;width:100%;height:100vh;background:black;display:flex;justify-content:center;align-items:center;flex-direction:column;cursor:pointer;z-index:10;}
#intro h1{font-family:'Dancing Script',cursive;font-size:3em;color:#ff4da6;animation:pulse 2s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1);}}
#mainScene{display:none;background:radial-gradient(ellipse at bottom,#0a0f2c 0%,#000 100%);height:100vh;overflow:hidden;animation:fadeIn 2s ease forwards;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.moon{position:absolute;top:80px;right:120px;width:130px;height:130px;background:radial-gradient(circle,#fff 40%,#ddd 60%,transparent 70%);border-radius:50%;box-shadow:0 0 40px #fff,0 0 100px #aaa;}
.shooting-star{position:absolute;width:2px;height:100px;background:linear-gradient(-45deg,white,transparent);animation:shoot 5s linear infinite;opacity:.8;}
@keyframes shoot{0%{transform:translate(0,0) rotate(45deg);opacity:1;}100%{transform:translate(-800px,800px) rotate(45deg);opacity:0;}}
.container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90%;}
h1{font-family:'Dancing Script',cursive;font-size:3.5em;color:#ff80bf;}
button{padding:12px 28px;margin:15px;border:none;border-radius:30px;font-size:16px;cursor:pointer;}
.yes{background:#ff4da6;color:white;}
.no{background:white;color:black;position:absolute;}
.heart,.balloon,.confetti{position:absolute;}
.heart{font-size:24px;animation:rise 6s linear infinite;}
@keyframes rise{0%{transform:translateY(100vh);opacity:1;}100%{transform:translateY(-10vh);opacity:0;}}
.balloon{font-size:30px;animation:balloonUp 8s linear infinite;}
@keyframes balloonUp{0%{transform:translateY(100vh);}100%{transform:translateY(-20vh);}}
.confetti{width:8px;height:8px;animation:fall 4s linear infinite;}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);}100%{transform:translateY(110vh) rotate(360deg);}}
</style>
</head>

<body>

<div id="intro" onclick="startExperience()">
  <h1>Tap to Begin Our Story 💖</h1>
  <p>✨ Aishwarya has something special for you ✨</p>
</div>

<div id="mainScene">
  <div class="moon"></div>
  <div class="shooting-star" style="top:100px; left:90%; animation-delay:1s;"></div>
  <div class="shooting-star" style="top:200px; left:80%; animation-delay:3s;"></div>

  <div class="container">
    <h1>Aishwarya ❤️ Atul</h1>
    <p>Atul… under this magical sky 🌙✨</p>
    <h2 style="color:#ff99cc;">Will you be my Valentine? 💖</h2>

    <button class="yes" onclick="celebrate()">Yes 💘</button>
    <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<div id="musicPlayer"></div>

<script>
function startExperience(){
  document.getElementById("intro").style.display="none";
  document.getElementById("mainScene").style.display="block";
  document.getElementById("musicPlayer").innerHTML=`
    <iframe width="0" height="0"
    src="https://www.youtube.com/embed/7bFhZL0RkQw?autoplay=1&loop=1&playlist=7bFhZL0RkQw"
    frameborder="0" allow="autoplay"></iframe>`;
}

const noBtn=document.getElementById("noBtn");
function moveHard(){
  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-50);
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
  noBtn.style.transform="scale("+(Math.random()*0.5+0.5)+")";
}
noBtn.addEventListener("mouseover",moveHard);
noBtn.addEventListener("click",moveHard);

function celebrate(){
  document.body.innerHTML=`
  <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:black;color:white;flex-direction:column;">
    <h1 style="font-family:'Dancing Script',cursive;color:#ff4da6;font-size:3em;">
      He Said YES 💖✨
    </h1>
    <p style="font-size:1.3em;">
      Aishwarya & Atul — A love written in the stars 🌟
    </p>
  </div>`;

  setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  },300);

  setInterval(()=>{
    const balloon=document.createElement("div");
    balloon.className="balloon";
    balloon.innerHTML="🎈";
    balloon.style.left=Math.random()*100+"vw";
    document.body.appendChild(balloon);
    setTimeout(()=>balloon.remove(),8000);
  },800);

  setInterval(()=>{
    const conf=document.createElement("div");
    conf.className="confetti";
    conf.style.left=Math.random()*100+"vw";
    conf.style.background=["#ff4d4d","#ffcc00","#66ff66","#66ccff","#ff66cc"][Math.floor(Math.random()*5)];
    document.body.appendChild(conf);
    setTimeout(()=>conf.remove(),4000);
  },100);
}
</script>

</body>
</html>
